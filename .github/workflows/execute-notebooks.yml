name: Execute notebooks

# Запускает оба блокнота и сохраняет в них результаты и графики
on:
  push:
    paths: ["**.ipynb", ".github/workflows/execute-notebooks.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy matplotlib scipy scikit-learn nbconvert ipykernel
      - name: Execute notebooks
        run: |
          for nb in PR3_part1_cleaning_EDA.ipynb PR3_part2_preprocessing.ipynb; do
            jupyter nbconvert --to notebook --execute --inplace "$nb"
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.ipynb
          git commit -m "Блокноты выполнены: добавлены результаты и графики" || echo "Нет изменений"
          git push
